# Temporary: looks at public Umamusume support card data sources so the deck
# builder can use one. Run by hand; prints a summary of each source.
name: Probe card data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sources
        shell: python
        run: |
          import json, re, urllib.request

          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      body = r.read()
                      print(f"\n=== {url} -> {r.status} {r.headers.get('Content-Type')} {len(body)} bytes")
                      return body.decode("utf-8", "replace")
              except Exception as e:
                  print(f"\n=== {url} -> ERROR {e!r}")
                  return None

          def show_json(text, limit=2500):
              try:
                  data = json.loads(text)
              except Exception as e:
                  print("not JSON:", e, text[:500]); return None
              if isinstance(data, list):
                  print(f"list of {len(data)}; first item:")
                  print(json.dumps(data[0], ensure_ascii=False)[:limit] if data else "(empty)")
              elif isinstance(data, dict):
                  print("keys:", list(data)[:40])
                  print(json.dumps(data, ensure_ascii=False)[:limit])
              return data

          # Round 4: the wiki modules that render support cards, and the effect type names.
          import urllib.parse
          RAW = "https://gitlab.com/umamusume-wiki/lua-modules/-/raw/main/modules/"
          for path in ("Game/Supports.lua", "Game/Supports/Data/Effects.lua"):
              t = get(RAW + path)
              if t:
                  print(t if path.endswith("Supports.lua") else t[t.index("function Effects.getPrettyName"):][:4500])
          # Which wiki pages invoke the Supports module?
          t = get("https://umamusu.wiki/w/api.php?format=json&action=query&list=search&srlimit=10&srsearch=" + urllib.parse.quote('insource:"Game/Supports"'))
          if t: print(t[:2500])
