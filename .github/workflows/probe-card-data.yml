# Temporary: looks at public Umamusume support card data sources so the deck
# builder can use one. Run by hand; prints a summary of each source.
name: Probe card data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sources
        shell: python
        run: |
          import json, re, urllib.request

          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      body = r.read()
                      print(f"\n=== {url} -> {r.status} {r.headers.get('Content-Type')} {len(body)} bytes")
                      return body.decode("utf-8", "replace")
              except Exception as e:
                  print(f"\n=== {url} -> ERROR {e!r}")
                  return None

          def show_json(text, limit=2500):
              try:
                  data = json.loads(text)
              except Exception as e:
                  print("not JSON:", e, text[:500]); return None
              if isinstance(data, list):
                  print(f"list of {len(data)}; first item:")
                  print(json.dumps(data[0], ensure_ascii=False)[:limit] if data else "(empty)")
              elif isinstance(data, dict):
                  print("keys:", list(data)[:40])
                  print(json.dumps(data, ensure_ascii=False)[:limit])
              return data

          # Round 5: read the Supports module, then try each of its functions on a real SSR card.
          import urllib.parse
          W = "https://umamusu.wiki/w/api.php?format=json&"
          src = get("https://umamusu.wiki/Module:Game/Supports?action=raw") or ""
          print(src[:9000])
          eff = get("https://umamusu.wiki/Module:Game/Supports/Data/Effects?action=raw") or ""
          i = eff.find("function Effects.getPrettyName")
          print(eff[i:i + 4000])
          cards = json.loads(get("https://umapyoi.net/api/v1/support") or "[]")
          ssr = next((c for c in cards if str(c.get("id", "")).startswith("3")), None)
          print("SSR sample:", ssr)
          names = sorted(set(re.findall(r"function \w+\.(\w+)\s*\(\s*frame", src)))
          print("frame functions:", names)
          for name in names[:12]:
              for args in (f"|{ssr['id']}", f"|id={ssr['id']}"):
                  text = "{{#invoke:Game/Supports|%s%s}}" % (name, args)
                  t = get(W + "action=expandtemplates&prop=wikitext&text=" + urllib.parse.quote(text))
                  if t:
                      out = json.loads(t).get("expandtemplates", {}).get("wikitext", "")
                      print(f"--- {text}: {len(out)} chars\n{out[:1800]}")
