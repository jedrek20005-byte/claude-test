# Temporary: looks at public Umamusume support card data sources so the deck
# builder can use one. Run by hand; prints a summary of each source.
name: Probe card data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sources
        shell: python
        run: |
          import json, re, urllib.request

          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      body = r.read()
                      print(f"\n=== {url} -> {r.status} {r.headers.get('Content-Type')} {len(body)} bytes")
                      return body.decode("utf-8", "replace")
              except Exception as e:
                  print(f"\n=== {url} -> ERROR {e!r}")
                  return None

          def show_json(text, limit=2500):
              try:
                  data = json.loads(text)
              except Exception as e:
                  print("not JSON:", e, text[:500]); return None
              if isinstance(data, list):
                  print(f"list of {len(data)}; first item:")
                  print(json.dumps(data[0], ensure_ascii=False)[:limit] if data else "(empty)")
              elif isinstance(data, dict):
                  print("keys:", list(data)[:40])
                  print(json.dumps(data, ensure_ascii=False)[:limit])
              return data

          # Round 2: how the wiki reads support card effects, and where its game data lives.
          for page in ("Module:Game/Supports/Data/Leveled", "Module:Game/Supports/Data/Unique", "Module:Game"):
              t = get(f"https://umamusu.wiki/{page}?action=raw")
              if t: print(t[:6000])
          t = get("https://gitlab.com/api/v4/groups/umamusume-wiki/projects?per_page=50&include_subgroups=true")
          if t:
              try:
                  for proj in json.loads(t):
                      print("-", proj.get("path_with_namespace"), "|", (proj.get("description") or "")[:150], "|", proj.get("web_url"))
              except Exception as e:
                  print("bad json", e, t[:300])
          for api in ("https://umamusu.wiki/w/api.php?action=query&meta=siteinfo&format=json",
                      "https://umamusu.wiki/api.php?action=query&meta=siteinfo&format=json"):
              t = get(api)
              if t: print(t[:800])
