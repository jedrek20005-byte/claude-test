# Temporary: looks at public Umamusume support card data sources so the deck
# builder can use one. Run by hand; prints a summary of each source.
name: Probe card data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sources
        shell: python
        run: |
          import json, re, urllib.request

          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      body = r.read()
                      print(f"\n=== {url} -> {r.status} {r.headers.get('Content-Type')} {len(body)} bytes")
                      return body.decode("utf-8", "replace")
              except Exception as e:
                  print(f"\n=== {url} -> ERROR {e!r}")
                  return None

          def show_json(text, limit=2500):
              try:
                  data = json.loads(text)
              except Exception as e:
                  print("not JSON:", e, text[:500]); return None
              if isinstance(data, list):
                  print(f"list of {len(data)}; first item:")
                  print(json.dumps(data[0], ensure_ascii=False)[:limit] if data else "(empty)")
              elif isinstance(data, dict):
                  print("keys:", list(data)[:40])
                  print(json.dumps(data, ensure_ascii=False)[:limit])
              return data

          # 1. umapyoi.net public API
          data = None
          text = get("https://umapyoi.net/api/v1/support")
          if text:
              data = show_json(text)
          if isinstance(data, list) and data:
              first = data[0]
              sid = first.get("support_id") or first.get("id")
              for path in (f"/api/v1/support/{sid}", f"/api/v1/support/{sid}/effects"):
                  t = get("https://umapyoi.net" + path)
                  if t: show_json(t, 4000)

          # 2. GameTora supports page (Next.js data)
          html = get("https://gametora.com/umamusume/supports")
          if html:
              print("data urls:", sorted(set(re.findall(r'/data/umamusume/[\w./-]+', html)))[:20])
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              if m:
                  nd = json.loads(m.group(1))
                  print("buildId:", nd.get("buildId"))
                  props = nd.get("props", {}).get("pageProps", {})
                  print("pageProps keys:", list(props)[:30])
                  for k, v in props.items():
                      if isinstance(v, list) and v:
                          print(f"pageProps[{k!r}]: list of {len(v)}; first:", json.dumps(v[0], ensure_ascii=False)[:2500])

          # 3. Umamusume wiki data modules
          t = get("https://umamusu.wiki/api.php?action=query&list=allpages&apnamespace=828&apprefix=Game/Supports&aplimit=50&format=json")
          if t: show_json(t, 3000)
          t = get("https://umamusu.wiki/Module:Game/Supports/Data?action=raw")
          if t: print(t[:3000])
