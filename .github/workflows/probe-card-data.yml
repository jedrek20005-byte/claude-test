# Temporary: looks at public Umamusume support card data sources so the deck
# builder can use one. Run by hand; prints a summary of each source.
name: Probe card data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sources
        shell: python
        run: |
          import json, re, urllib.request

          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      body = r.read()
                      print(f"\n=== {url} -> {r.status} {r.headers.get('Content-Type')} {len(body)} bytes")
                      return body.decode("utf-8", "replace")
              except Exception as e:
                  print(f"\n=== {url} -> ERROR {e!r}")
                  return None

          def show_json(text, limit=2500):
              try:
                  data = json.loads(text)
              except Exception as e:
                  print("not JSON:", e, text[:500]); return None
              if isinstance(data, list):
                  print(f"list of {len(data)}; first item:")
                  print(json.dumps(data[0], ensure_ascii=False)[:limit] if data else "(empty)")
              elif isinstance(data, dict):
                  print("keys:", list(data)[:40])
                  print(json.dumps(data, ensure_ascii=False)[:limit])
              return data

          # Round 3: find something that already outputs card effects, and the master data's origin.
          import urllib.parse
          W = "https://umamusu.wiki/w/api.php?format=json&"
          t = get("https://gitlab.com/api/v4/projects/umamusume-wiki%2Flua-modules/repository/tree?recursive=true&per_page=100")
          if t:
              paths = [x["path"] for x in json.loads(t)]
              print("lua-modules files:", [p for p in paths if "upport" in p or "ffect" in p or "json" in p.lower()])
          t = get("https://gitlab.com/api/v4/projects/umamusume-wiki%2Fdocker-umamusu-wiki/repository/tree?recursive=true&per_page=100")
          if t:
              paths = [x["path"] for x in json.loads(t)]
              print("docker files:", paths[:100])
              for path in paths:
                  if any(k in path.lower() for k in ("master", "sync", "update", "fetch", "download")) and not path.endswith("/"):
                      raw = get("https://gitlab.com/umamusume-wiki/docker-umamusu-wiki/-/raw/main/" + urllib.parse.quote(path))
                      if raw: print(raw[:2500])
          t = get("https://umamusu.wiki/Module:Game/Supports/Data/Effects?action=raw")
          if t: print(t[:5000])
          t = get(W + "action=query&list=search&srlimit=5&srwhat=title&srsearch=" + urllib.parse.quote("Kitasan Black"))
          if t: print(t[:1500])
          t = get(W + "action=query&list=search&srlimit=5&srsearch=" + urllib.parse.quote("Fan Bonus support card"))
          if t: print(t[:1500])
