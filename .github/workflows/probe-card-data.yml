# Temporary: looks at public Umamusume support card data sources so the deck
# builder can use one. Run by hand; prints a summary of each source.
name: Probe card data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sources
        shell: python
        run: |
          import json, re, urllib.request

          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      body = r.read()
                      print(f"\n=== {url} -> {r.status} {r.headers.get('Content-Type')} {len(body)} bytes")
                      return body.decode("utf-8", "replace")
              except Exception as e:
                  print(f"\n=== {url} -> ERROR {e!r}")
                  return None

          def show_json(text, limit=2500):
              try:
                  data = json.loads(text)
              except Exception as e:
                  print("not JSON:", e, text[:500]); return None
              if isinstance(data, list):
                  print(f"list of {len(data)}; first item:")
                  print(json.dumps(data[0], ensure_ascii=False)[:limit] if data else "(empty)")
              elif isinstance(data, dict):
                  print("keys:", list(data)[:40])
                  print(json.dumps(data, ensure_ascii=False)[:limit])
              return data

          # Round 6: the wiki's card list (Cargo) and batching several cards per request.
          import time, urllib.parse
          W = "https://umamusu.wiki/w/api.php?format=json&"
          t = get(W + "action=cargofields&table=Game_Supports")
          if t: print(t[:3000])
          t = get("https://umamusu.wiki/w/index.php?title=Special:CargoExport&tables=Game_Supports&fields=_pageName,support_id&format=json&limit=3")
          if t: print(t[:1000])
          ids = [30028, 30016, 30043, 30065, 30078, 20013, 20023, 10050]
          text = "".join("@@%d@@{{#invoke:Game/Supports|bonusTable|%d}}{{#invoke:Game/Supports|supportLink|%d}}" % (i, i, i) for i in ids)
          start_t = time.time()
          t = get(W + "action=expandtemplates&prop=wikitext&text=" + urllib.parse.quote(text))
          print("batch took", round(time.time() - start_t, 2), "s")
          if t:
              out = json.loads(t).get("expandtemplates", {}).get("wikitext", "")
              for chunk in out.split("@@")[1:]:
                  pass
              # Print rows mentioning race/fan bonus and any cell with both a base and a unique value.
              for part in re.split(r"@@(\d+)@@", out)[1:]:
                  print("---", part[:300] if not part.strip().startswith("<table") else "")
              for m in re.finditer(r"<tr><th><span class=\"tooltip\">(Race Bonus|Fan Bonus)<span.*?</tr>", out):
                  print("ROW:", re.sub(r"<span class=\"text\">.*?</span>", "", m.group(0))[:400])
              cells = sorted(set(re.findall(r"<td>([^<]*)</td>", out)))
              print("distinct cell texts:", cells[:120])
              print("headers:", sorted(set(re.findall(r"<th>(Lv\d+)</th>", out))))
