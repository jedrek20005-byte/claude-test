name: Build soundboard app (Windows)
on:
  workflow_dispatch:
  push:
    paths: ['soundboard/**']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: soundboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Soundboard-windows
          path: |
            soundboard/dist/*.exe
