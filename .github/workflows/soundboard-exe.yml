name: Build soundboard app (Windows)
on:
  workflow_dispatch:
  push:
    paths: ['soundboard/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: soundboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Zip the full app folder
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/Soundboard-Folder.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Soundboard-windows
          path: |
            soundboard/dist/Soundboard-Setup.exe
            soundboard/dist/Soundboard-Portable.exe
            soundboard/dist/Soundboard-Folder.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: soundboard-build-${{ github.run_number }}
          name: Soundboard app (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: |
            soundboard/dist/Soundboard-Setup.exe
            soundboard/dist/Soundboard-Portable.exe
            soundboard/dist/Soundboard-Folder.zip
