name: Explore race data

# Temporary: looks for race and aptitude data on the wiki and umapyoi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look around
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=40) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", None), repr(e)
          api = "https://umamusu.wiki/w/api.php?"
          def q(**params):
              s, body = get(api + urllib.parse.urlencode({"format": "json", **params}))
              return json.loads(body) if s == 200 else {"error": body[:300]}
          def source(title, n):
              data = q(action="query", prop="revisions", rvprop="content", rvslots="main", titles=title)
              page = next(iter(data.get("query", {}).get("pages", {}).values()), {})
              text = page.get("revisions", [{}])[0].get("slots", {}).get("main", {}).get("*", "MISSING")
              print("=====", title, len(text)); print(text[:n])
          base = "https://gametora.com"
          man = json.loads(get(base + "/data/manifests/umamusume.json")[1])
          print("KEYS", [k for k in man if "/" not in k])
          def load(key):
              return json.loads(get(f"{base}/data/umamusume/{key}.{man[key]}.json")[1])
          inst = load("race_instances")
          fans = {f["id"]: f["fans"] for f in load("race-fans")}
          normal = [r for r in inst if not r.get("special_race")]
          print("INSTANCES", len(inst), "normal", len(normal), "special", [r["id"] for r in inst if r.get("special_race")])
          print("INSTANCE KEYS", sorted({k for r in normal for k in r}))
          from collections import Counter
          print("GRADES", Counter(r["details"]["grade"] for r in normal))
          print("YEARS", Counter(r["year"] for r in normal))
          for r in sorted(normal, key=lambda r: (r["year"], r["month"], r["half"]))[:4] + [r for r in normal if r["details"]["name_en"] in ("Japan Cup", "Arima Kinen", "Tokyo Yushun (Japanese Derby)")]:
              d = r["details"]
              print(r["year"], r["month"], r["half"], d["name_en"], d["grade"], d["terrain"], d["distance"], "fans_gain", r["fans_gain"], "needed", r["fans_needed"], "1st", fans.get(r["fans_gain"], [{}])[0], "unreleased", d.get("unreleased_servers"))
          for i in (1, 20, 29, 40, 61):
              print("FANSET", i, fans[i][:3])
