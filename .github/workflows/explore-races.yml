name: Explore race data

# Temporary: looks for race and aptitude data on the wiki and umapyoi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look around
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          UA = {"User-Agent": "UmamusumeDailyBot/1.0 (+https://github.com/jedrek20005-byte/claude-test)"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=40) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", None), repr(e)
          api = "https://umamusu.wiki/w/api.php?"
          s, body = get(api + urllib.parse.urlencode({"action": "query", "list": "allpages", "apnamespace": 828, "aplimit": 500, "format": "json"}))
          titles = [p["title"] for p in json.loads(body)["query"]["allpages"]] if s == 200 else []
          print("MODULES", s, len(titles))
          print([t for t in titles if any(k in t.lower() for k in ("race", "chara", "apt", "sched", "program", "fan", "career", "objective"))])
          for q in ("Race list", "List of races", "Races"):
              s, body = get(api + urllib.parse.urlencode({"action": "query", "list": "search", "srsearch": q, "srlimit": 10, "format": "json"}))
              print("SEARCH", q, s, [r["title"] for r in json.loads(body)["query"]["search"]] if s == 200 else body[:200])
          for url in ("https://umapyoi.net/api/v1/character/list", "https://umapyoi.net/api/v1/race", "https://umapyoi.net/api/v1/race/list"):
              s, body = get(url)
              print("UMAPYOI", url, s, body[:600])
