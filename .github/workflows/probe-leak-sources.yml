name: Probe leak sources

# Temporary: checks which leak sources can be read from a server.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try them
        shell: python
        run: |
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (compatible; ModernWarshipsLeaks/1.0)"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      return r.status, r.headers.get("Content-Type", ""), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", None), "", repr(e)[:200]
          for url in ("https://www.reddit.com/r/ModernWarships/new.json?limit=5",
                      "https://old.reddit.com/r/ModernWarships/new.json?limit=5",
                      "https://www.reddit.com/r/ModernWarships/new/.rss",
                      "https://www.reddit.com/r/ModernWarships/search.json?q=leak&restrict_sr=1&sort=new&limit=5"):
              s, kind, body = get(url)
              print("REDDIT", url, s, kind, body[:300].replace("\n", " "))
          s, kind, body = get("https://www.youtube.com/@ModernWarshipsOfficial")
          ids = re.findall(r'"(?:channelId|externalId)":"(UC[\w-]{22})"', body)
          print("YT PAGE", s, ids[:3])
          if ids:
              s, kind, body = get(f"https://www.youtube.com/feeds/videos.xml?channel_id={ids[0]}")
              print("YT FEED", s, re.findall(r"<title>(.*?)</title>", body)[:4])
          s, kind, body = get("https://t.me/s/telegram")
          print("TG", s, len(body), len(re.findall(r'data-post="', body)), re.findall(r'data-post="([^"]+)"', body)[:3])
