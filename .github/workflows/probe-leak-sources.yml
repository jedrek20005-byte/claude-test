name: Probe leak sources

# Temporary: finds the channels behind known Modern Warships leak videos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look up
        shell: python
        run: |
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)", "Accept-Language": "en"}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", None), repr(e)[:200]
          for vid in ("UiofvUBRhYU", "rE90XGMDCp0", "amDtgMxKXwY", "FasBjP-M0xw"):
              s, body = get(f"https://www.youtube.com/watch?v={vid}")
              cid = re.search(r'"channelId":"(UC[\w-]{22})"', body)
              handle = re.search(r'"canonicalBaseUrl":"/(@[^"]+)"', body)
              name = re.search(r'"ownerChannelName":"([^"]+)"', body)
              title = re.search(r'<title>([^<]+)</title>', body)
              print("VIDEO", vid, s, cid and cid.group(1), handle and handle.group(1), name and name.group(1), title and title.group(1))
          s, body = get("https://www.youtube.com/results?search_query=modern+warships+leaks")
          seen = {}
          for m in re.finditer(r'"ownerText":\{"runs":\[\{"text":"([^"]+)".*?"canonicalBaseUrl":"/(@[^"]+)"', body):
              seen[m.group(2)] = seen.get(m.group(2), 0) + 1
          print("SEARCH CHANNELS", s, sorted(seen.items(), key=lambda x: -x[1])[:15])
          s, body = get("https://t.me/s/modernwarships")
          print("TG official", s, len(re.findall(r'data-post="', body)))
          for name in ("mwleaks", "modernwarshipsleaks", "mw_leaks", "modernwarships_leaks"):
              s, body = get(f"https://t.me/s/{name}")
              print("TG", name, s, len(re.findall(r'data-post="', body)), re.search(r'<meta property="og:title" content="([^"]*)"', body) and re.search(r'<meta property="og:title" content="([^"]*)"', body).group(1))
          s, body = get("https://www.reddit.com/r/ModernWarships/new/.rss")
          titles = re.findall(r"<title>([^<]+)</title>", body)
          print("REDDIT", s, len(titles), [t for t in titles if "leak" in t.lower()][:10])
